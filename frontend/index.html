<!doctype html>
<html lang="zh-CN" spellcheck="false" autocomplete="off">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo/omni.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <title>OmniPanel</title>
    <script>
      // 尽早（CSS 加载前）从 localStorage 读取主题并设置 data-theme，
      // 避免浅色主题下页面加载瞬间闪烁深色背景
      (function () {
        try {
          var raw = localStorage.getItem("omnipanel-settings");
          var theme = "system";
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state && parsed.state.theme) {
              theme = parsed.state.theme;
            }
          }
          var resolved =
            theme === "light" || theme === "dark"
              ? theme
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          /* 读取失败时保持默认暗色 */
        }
      })();
    </script>
    <style>
      /* 仅同色底，真正启动 UI 只由 React SplashScreen 负责，避免双套样式 */
      html, body {
        margin: 0;
        height: 100%;
        background: #201d1d;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #f5f5f7;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #201d1d;
      }
      html[data-theme="light"] #boot-splash {
        background: #f5f5f7;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true"></div>
    <div id="root"></div>
    <!-- Docker 运行时由 entrypoint 生成；本地开发 404 可忽略 -->
    <script src="/omnipanel-runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
