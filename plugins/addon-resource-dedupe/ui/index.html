<div id="app">
  <div class="row">
    <span id="status">正在扫描重复资源…</span>
    <button id="rescan" type="button">重新扫描</button>
  </div>
  <div id="list"></div>
  <div id="confirm" hidden>
    <p id="confirm-text"></p>
    <div class="row">
      <button id="back" type="button">返回</button>
      <button id="go" type="button">确认清理</button>
    </div>
  </div>
</div>
<style>
  html, body { height: 100%; }
  body { box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; }
  #app { display: flex; flex-direction: column; gap: 8px; min-height: 0; flex: 1; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #status { color: var(--muted); font-size: 12px; }
  #list { overflow: auto; min-height: 0; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .group { border: 1px solid var(--border); border-radius: var(--r-md); padding: 8px; }
  .group h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; }
  .meta { color: var(--meta); font-size: 11px; }
  label.member { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; cursor: pointer; }
  label.member input { margin-top: 3px; }
  .name { font-size: 12px; }
  .skip { font-size: 11px; color: var(--muted); }
  #confirm p { margin: 0 0 8px; font-size: 12px; line-height: 1.5; }
  button:disabled { opacity: 0.45; cursor: default; }
</style>
<script>
(function () {
  var KIND = {
    ssh: "SSH",
    database: "数据库",
    docker: "Docker",
    panel: "面板",
    cloud: "云账号",
    protocol: "协议",
    file: "文件",
    service: "服务",
    "ssh-key": "SSH 密钥",
    "http-request": "HTTP 请求"
  };
  var REF = {
    sql_executions: "SQL 记录",
    terminal_history_blocks: "终端历史",
    file_transfer_jobs: "文件传输",
    tasks: "任务",
    task_events: "任务事件",
    resource_tag_links: "标签",
    resource_observations: "资源档案",
    knowledge_entries: "知识库",
    skill_applications: "技能记录",
    workflows: "工作流",
    http_history: "HTTP 历史",
    connections_config: "关联配置",
    ai_traces: "AI 追踪"
  };
  var scan = null;
  var statusEl = document.getElementById("status");
  var listEl = document.getElementById("list");
  var confirmEl = document.getElementById("confirm");

  function kindLabel(kind) { return KIND[kind] || kind; }

  function selectedPlan() {
    var groups = [];
    document.querySelectorAll(".group").forEach(function (node) {
      if (node.querySelector(".skip-box") && !node.querySelector(".skip-box").checked) return;
      var picked = node.querySelector("input[type=radio]:checked");
      if (!picked) return;
      var keepId = picked.value;
      var dropIds = [];
      node.querySelectorAll("input[type=radio]").forEach(function (radio) {
        if (radio.value !== keepId) dropIds.push(radio.value);
      });
      if (dropIds.length) groups.push({ keepId: keepId, dropIds: dropIds });
    });
    return groups;
  }

  function render() {
    confirmEl.hidden = true;
    listEl.innerHTML = "";
    var groups = (scan && scan.groups) || [];
    if (!groups.length) {
      statusEl.textContent = "没有发现重复资源。";
      return;
    }
    var total = groups.reduce(function (sum, group) { return sum + group.members.length - 1; }, 0);
    statusEl.textContent = "发现 " + groups.length + " 组、可清理 " + total + " 项。每组选一条保留。";
    groups.forEach(function (group, index) {
      var card = document.createElement("section");
      card.className = "group";
      var title = document.createElement("h3");
      title.textContent = kindLabel(group.kind) + " · " + group.label;
      card.appendChild(title);
      var locked = group.members.some(function (member) { return member.protected; });
      group.members.forEach(function (member) {
        var label = document.createElement("label");
        label.className = "member";
        var radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "keep-" + index;
        radio.value = member.id;
        radio.checked = !!member.preferred;
        if (locked && !member.protected) radio.disabled = true;
        var text = document.createElement("span");
        var bits = [member.name || member.id];
        if (member.summary && member.summary !== member.name) bits.push(member.summary);
        if (member.group) bits.push(member.group);
        if (member.envTag && member.envTag !== "unknown") bits.push(member.envTag);
        if (member.hasSecret) bits.push("有凭据");
        if (member.protected) bits.push("内置");
        text.className = "name";
        text.textContent = bits.join(" · ");
        label.appendChild(radio);
        label.appendChild(text);
        card.appendChild(label);
      });
      var skip = document.createElement("label");
      skip.className = "skip";
      var box = document.createElement("input");
      box.type = "checkbox";
      box.className = "skip-box";
      box.checked = true;
      skip.appendChild(box);
      skip.appendChild(document.createTextNode(" 清理这一组"));
      card.appendChild(skip);
      listEl.appendChild(card);
    });
    var actions = document.createElement("div");
    actions.className = "row";
    var go = document.createElement("button");
    go.type = "button";
    go.textContent = "合并并清理";
    go.onclick = askConfirm;
    actions.appendChild(document.createElement("span"));
    actions.appendChild(go);
    listEl.appendChild(actions);
  }

  function askConfirm() {
    var plan = selectedPlan();
    if (!plan.length) {
      statusEl.textContent = "没有选中要清理的分组。";
      return;
    }
    var drops = plan.reduce(function (sum, group) { return sum + group.dropIds.length; }, 0);
    document.getElementById("confirm-text").textContent =
      "将保留 " + plan.length + " 条，删除 " + drops +
      " 条重复项。标签、空着的配置和缺失的凭据会补到保留项上；SQL 记录、终端历史、传输任务、绑定的 SSH / Docker / 面板引用会改挂过去。已经打开的终端不会被关掉，只是改挂到保留的资源。这一步不能撤销。";
    confirmEl.hidden = false;
    confirmEl.dataset.plan = JSON.stringify(plan);
  }

  async function runScan() {
    statusEl.textContent = "正在扫描…";
    listEl.innerHTML = "";
    confirmEl.hidden = true;
    try {
      scan = await window.host.invoke("scan", {});
      render();
    } catch (err) {
      statusEl.textContent = "扫描失败：" + err;
    }
  }

  document.getElementById("rescan").onclick = function () { void runScan(); };
  document.getElementById("back").onclick = function () { confirmEl.hidden = true; };
  document.getElementById("go").onclick = async function () {
    var button = document.getElementById("go");
    button.disabled = true;
    statusEl.textContent = "正在合并并清理…";
    try {
      var plan = JSON.parse(confirmEl.dataset.plan || "{\"groups\":[]}");
      var report = await window.host.invoke("apply", { groups: plan });
      var refs = (report.references || [])
        .map(function (item) { return (REF[item.table] || item.table) + " " + item.count; })
        .join("，");
      statusEl.textContent =
        "已保留 " + (report.kept || 0) + " 条，删除 " + (report.removed || 0) + " 条。" +
        (refs ? "已改挂：" + refs + "。" : "") +
        "打开中的终端、数据库和 Docker 会话已改挂到保留项。";
      confirmEl.hidden = true;
      listEl.innerHTML = "";
      scan = null;
    } catch (err) {
      statusEl.textContent = "清理失败：" + err;
    } finally {
      button.disabled = false;
    }
  };

  void runScan();
})();
</script>
