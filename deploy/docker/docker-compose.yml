# OmniPanel Web — Docker Compose 一键启动
#
# 用法:
#   cd deploy/docker
#   cp .env.example .env    # 必须设置 OMNIPANEL_API_KEY；先确认正式 Docker 工作流成功
#   docker compose up -d
#   浏览器打开 http://localhost:8899
#
# 默认仅回环监听，不挂载 Docker socket。管理 Engine 需显式附加 engine override。

services:
  omnipanel:
    image: ${OMNIPANEL_IMAGE:-ghcr.io/omniultrax/omnipanel-web:0.8.58}
    container_name: omnipanel-web
    ports:
      - "${OMNIPANEL_BIND_HOST:-127.0.0.1}:${OMNIPANEL_PORT:-8899}:8899"
    environment:
      OMNIPANEL_API_KEY: ${OMNIPANEL_API_KEY:?Set OMNIPANEL_API_KEY in .env}
      OMNIPANEL_PORT: "8899"
      OMNIPANEL_BIND: "0.0.0.0"
      OMNIPANEL_SECURE_COOKIE: ${OMNIPANEL_SECURE_COOKIE:-0}
    volumes:
      - omnipanel-data:/data
      # Optional, high privilege: explicitly opt in via docker-compose.engine.yml.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8899/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  omnipanel-data:
