services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Omni_Test_123"
    ports:
      - "11433:1433"
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/omni_test
    ports:
      - "17687:7687"
  cassandra:
    image: cassandra:4.1
    ports:
      - "19042:9042"
  # 8.1.3 默认账号 SYSDBA / SYSDBA_dm001
  dameng:
    image: onlyoffice/damengdb:8.1.3
    privileged: true
    environment:
      PAGE_SIZE: "16"
      LD_LIBRARY_PATH: /opt/dmdbms/bin
      INSTANCE_NAME: dm8db
    ports:
      - "15236:5236"
