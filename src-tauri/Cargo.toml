[package]
name = "omnipanel-app"
version.workspace = true
edition.workspace = true

[lib]
name = "omnipanel_lib"
crate-type = ["lib"]

[features]
default = []
# 仅用于排查打包问题；正式发布勿启用（macOS 使用私有 API，无法上架 App Store）。
debug-inspector = ["tauri/devtools"]
# 开发期 MCP Bridge（UI 自动化 / IPC 监控 / 日志抓取）。
# `tauri dev` 默认开启 debug_assertions 但不会启用本 feature，
# 需在开发时显式传 `--features dev-mcp` 或在 .cargo/config.toml 里默认开启。
dev-mcp = ["dep:tauri-plugin-mcp-bridge"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "dynamic-acl"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-snap-layout = "1"
# 开发期 MCP Bridge：仅 `--features dev-mcp` 激活 WebSocket server (默认端口 9223)，
# 供 @hypothesi/tauri-mcp-server 连接以做 UI 自动化 / IPC 监控 / 日志抓取。
# 生产构建 (release) 该插件为零代码路径，不影响打包。
tauri-plugin-mcp-bridge = { version = "0.12", optional = true }
omnipanel-core = { path = "../crates/omnipanel-core" }
omnipanel-ai = { path = "../crates/omnipanel-ai" }
omnipanel-error = { path = "../crates/omnipanel-error" }
omnipanel-bg = { path = "../crates/omnipanel-bg" }
omnipanel-store = { path = "../crates/omnipanel-store" }
omnipanel-exec = { path = "../crates/omnipanel-exec" }
omnipanel-ssh = { path = "../crates/omnipanel-ssh" }
omnipanel-db = { path = "../crates/omnipanel-db" }
omnipanel-db-sync = { path = "../crates/omnipanel-db-sync" }
omnipanel-docker = { path = "../crates/omnipanel-docker" }
omnipanel-assistant = { path = "../crates/omnipanel-assistant" }
omnipanel-mcp = { path = "../crates/omnipanel-mcp" }
omnipanel-plugin = { path = "../crates/omnipanel-plugin" }
omnipanel-everything = { path = "../crates/omnipanel-everything" }
omnipanel-gateway = { path = "../crates/omnipanel-gateway" }
omnipanel-transfer = { path = "../crates/omnipanel-transfer", features = ["specta"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
sqlx.workspace = true
redis.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
futures = "0.3"
async-trait = "0.1"

axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Protocol Lab
reqwest.workspace = true
rustls.workspace = true
serialport.workspace = true
rumqttc.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

# Terminal
hex.workspace = true
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
blowfish = "0.9"
sha1 = "0.10"
sysinfo.workspace = true
url.workspace = true
base64.workspace = true
urlencoding.workspace = true
fontdb = "0.23"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta.workspace = true
specta-typescript = "=0.0.12"
toml = "0.8"
md5 = "0.7"
pdf-extract = "0.7"
regex = "1"
shell-words = "1.1"
suppaftp = { version = "6", default-features = false, features = ["rustls"] }
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }
quick-xml = { version = "0.32", features = ["serialize"] }
# 阿里云 OSS：自签 SigV4（rust-s3 在 OSS 上易 SignatureDoesNotMatch）
hmac = "0.12"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
percent-encoding = "2"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"
webview2-com = "0.38"
