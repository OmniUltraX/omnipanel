# OmniPanel 云原生开发流水线
#
# 点击分支页「云原生开发」按钮 → 创建开发环境 → 自动构建并运行 Web 版前后端，
# 进入标准 WebIDE 环境，通过「端口」面板映射 8686 端口预览 Web 页面
# （等价于本地 `cargo run` + `vite build`）。
#
# 链路：
#   .cnb.yml (vscode 事件, 标准云开发模式)
#     └─ stages: 在完整源码工作区中构建前端(frontend/dist) + 后端(target/release/omnipanel-server)
#         └─ 通过 vscode:go 内置任务，等构建完成后再开放环境
#
# 说明：此前采用「仅预览模式」（onlyPreview + launch + 8686 端口自动检测）
# 多次构建失败，根因是仅预览模式在 Prepare 阶段即对 8686 端口做启动检测（窗口约 226s），
# 且该检测发生在 stages 构建之前；而 docker.build 镜像上下文不含仓库源码，无法镜像预编译产物，
# 导致 launch 启动时产物缺失、全量构建远超检测窗口而超时（见 Issue #20）。
# 故改为标准云开发模式：stages 完成构建，vscode:go 构建完成后再开放环境，
# 用户进入后通过「端口」面板映射 8686 预览 Web 页面，规避端口检测时序死锁。
#
# 业务端口 8686 需绑定 0.0.0.0 才能被端口预览访问（见 docs/web-p2.md）。
# 若需恢复「仅预览」自动打开页面，需先解决产物前置问题（如 docker.build 配置
# 源码上下文 by 列表以实现镜像预编译），再开启 vscode.options.onlyPreview。
$:
  vscode:
    - runner:
        cpus: 8
      docker:
        # 用仓库 .ide/Dockerfile 构建开发镜像（仅预装 Rust + Node 等工具链，
        # 不含源码构建，见 .ide/Dockerfile 注释）；
        # 构建失败时回退默认镜像 cnbcool/default-dev-env。
        build: .ide/Dockerfile
        image: cnbcool/default-dev-env:latest
      services:
        - docker
        - name: vscode
          options:
            # 标准云开发模式：构建完成后进入 WebIDE，通过「端口」面板映射 8686 预览。
            # 此前仅预览模式的 launch + daemon + 8686 自动检测在 Prepare 阶段早于 stages 执行，
            # 产物缺失导致端口检测超时（见文件头注释与 Issue #20），故移除。
            # 离线保活时间（超过则回收环境），避免长时间无操作被回收
            keepAliveTimeout: 30m
      env:
        OMNIPANEL_WEB: "1"
        OMNIPANEL_WEB_PORT: "8686"
      # 在完整源码工作区完成前后端构建（docker.build 上下文不含源码，无法镜像预编译），
      # 用 vscode:go 等全部构建完成后再开放环境，确保进入后即可通过 8686 端口预览。
      stages:
        - name: 安装前端依赖
          script: |
            set -euo pipefail
            cd "$CNB_BUILD_WORKSPACE"
            npm ci --prefix frontend || npm install --prefix frontend
        - name: 构建前端
          script: |
            set -euo pipefail
            cd "$CNB_BUILD_WORKSPACE"
            OMNIPANEL_WEB=1 SKIP_GEN_BINDINGS=1 npm run build --prefix frontend
        - name: 构建后端
          script: |
            set -euo pipefail
            cd "$CNB_BUILD_WORKSPACE"
            cargo build --release -p omnipanel-server
        - name: 就绪
          type: vscode:go
