name: Publish plugin registry

on:
  push:
    branches: [master]
    paths:
      - "plugins/registry.json"
      - "plugins/*/plugin.json"
      - "plugins/module-nacos/**"
      - "plugins/cloud-*/**"
      - "plugins/addon-warpgate/**"
      - "plugins/agent-*/**"
      - "scripts/stage-agent-sidecars.mjs"
      - "plugins-market/*/plugin.json"
      - "plugins-market/*/ui/**"
      - "plugins-market/*/logic.js"
      - "scripts/generate-plugin-registry.mjs"
      - "scripts/plugin-download-only.mjs"
      - ".github/workflows/publish-plugin-registry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Upload plugins-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate registry
        run: node scripts/generate-plugin-registry.mjs

      - name: Pack market plugins
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          mkdir -p dist
          node -e '
            const fs = require("fs");
            const path = require("path");
            const { execFileSync } = require("child_process");
            const { DOWNLOAD_ONLY_PLUGIN_DIRS } = require("./scripts/plugin-download-only.mjs");
            const manifestByDir = {};
            function packOne(rootDir, dir) {
              const manifestPath = path.join(rootDir, dir, "plugin.json");
              if (!fs.existsSync(manifestPath)) return;
              const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              const asset = manifest.id.replace(/\./g, "-") + "-" + manifest.version + ".omni-plugin";
              const key = rootDir + "/" + dir;
              manifestByDir[key] = { manifest, asset };
              execFileSync(
                "cargo",
                ["run", "-q", "-p", "omnipanel-plugin-pkg", "--bin", "pack", "--",
                 path.join(rootDir, dir), path.join("dist", asset)],
                { stdio: "inherit" },
              );
            }
            const market = "plugins-market";
            if (fs.existsSync(market)) {
              for (const dir of fs.readdirSync(market, { withFileTypes: true })) {
                if (!dir.isDirectory()) continue;
                packOne(market, dir.name);
              }
            }
            for (const dir of DOWNLOAD_ONLY_PLUGIN_DIRS) {
              // Agent sidecar 走矩阵任务按平台分包，这里跳过。
              if (String(dir).startsWith("agent-")) continue;
              packOne("plugins", dir);
            }
            fs.writeFileSync("dist/market-assets.json", JSON.stringify(manifestByDir, null, 2));
          '
          ls -la dist

      - name: Fill market artifact hash/size into staged registry
        run: |
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const manifestByDir = JSON.parse(fs.readFileSync("dist/market-assets.json", "utf8"));
            const registry = JSON.parse(fs.readFileSync("plugins/registry.json", "utf8"));
            for (const [key, { manifest, asset }] of Object.entries(manifestByDir)) {
              const bytes = fs.readFileSync("dist/" + asset);
              const entry = registry.plugins.find((p) => p.id === manifest.id);
              if (!entry) throw new Error("registry 缺少 " + manifest.id + "（" + key + "）");
              const url = `https://github.com/OmniUltraX/omnipanel/releases/download/plugins-latest/${asset}`;
              const artifact = {
                url,
                sha256: crypto.createHash("sha256").update(bytes).digest("hex"),
                size: bytes.length,
              };
              if (Array.isArray(entry.versions) && entry.versions.length) {
                entry.versions[0].version = manifest.version;
                entry.versions[0].artifact = artifact;
              } else {
                // 禁止再写扁平 v1：市场 parse 在 schemaVersion:2 下会丢掉无 versions 的条目
                entry.versions = [{ version: manifest.version, artifact }];
                delete entry.version;
                delete entry.distribution;
                delete entry.artifact;
              }
              console.log(`[market-artifact] ${manifest.id} v${manifest.version} sha256/size 回填完成`);
            }
            // Agent：registry 留平台无关 URL；客户端下载时改写为 -{triple}.omni-plugin
            for (const dir of require("./scripts/plugin-download-only.mjs").DOWNLOAD_ONLY_PLUGIN_DIRS) {
              if (!String(dir).startsWith("agent-")) continue;
              const file = "plugins/" + dir + "/plugin.json";
              if (!fs.existsSync(file)) continue;
              const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
              const entry = registry.plugins.find((p) => p.id === manifest.id);
              if (!entry) throw new Error("registry 缺少 agent " + manifest.id);
              const asset = manifest.id.replace(/\./g, "-") + "-" + manifest.version + ".omni-plugin";
              const url = `https://github.com/OmniUltraX/omnipanel/releases/download/plugins-latest/${asset}`;
              const artifact = { url, sha256: "", size: 8234 };
              if (Array.isArray(entry.versions) && entry.versions.length) {
                entry.versions[0].version = manifest.version;
                entry.versions[0].artifact = artifact;
              } else {
                entry.versions = [{ version: manifest.version, artifact }];
              }
              console.log(`[market-artifact] ${manifest.id} platform-agnostic URL 占位`);
            }
            fs.writeFileSync("plugin-registry.json", JSON.stringify(registry, null, 2) + "\n");
          '
          ls -la plugin-registry.json dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: plugins-latest
          name: Plugin registry
          body: Official OmniPanel plugin catalog (bundled first-party + downloadable extras).
          files: |
            plugin-registry.json
            dist/*.omni-plugin
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  agent-sidecars:
    name: Pack agent sidecars (${{ matrix.target }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stage and pack agent sidecars
        env:
          OMNIPANEL_TARGET_TRIPLE: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-agent-sidecars.mjs --release
          mkdir -p dist
          node -e '
            const fs = require("fs");
            const path = require("path");
            const { execFileSync } = require("child_process");
            const { DOWNLOAD_ONLY_PLUGIN_DIRS } = require("./scripts/plugin-download-only.mjs");
            const triple = process.env.OMNIPANEL_TARGET_TRIPLE;
            for (const dir of DOWNLOAD_ONLY_PLUGIN_DIRS) {
              if (!String(dir).startsWith("agent-")) continue;
              const manifestPath = path.join("plugins", dir, "plugin.json");
              if (!fs.existsSync(manifestPath)) continue;
              const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              const asset = manifest.id.replace(/\./g, "-") + "-" + manifest.version + "-" + triple + ".omni-plugin";
              execFileSync(
                "cargo",
                ["run", "-q", "-p", "omnipanel-plugin-pkg", "--bin", "pack", "--",
                 path.join("plugins", dir), path.join("dist", asset)],
                { stdio: "inherit" },
              );
              console.log("packed", asset);
            }
          '
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: plugins-latest
          files: dist/*.omni-plugin
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
