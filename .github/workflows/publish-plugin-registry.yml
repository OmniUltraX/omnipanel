name: Publish plugin registry

on:
  push:
    branches: [master]
    paths:
      - "plugins/registry.json"
      - "plugins/*/plugin.json"
      - "plugins-market/*/plugin.json"
      - "plugins-market/*/ui/**"
      - "plugins-market/*/logic.js"
      - "scripts/generate-plugin-registry.mjs"
      - ".github/workflows/publish-plugin-registry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Upload plugins-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate registry
        run: node scripts/generate-plugin-registry.mjs

      - name: Pack market plugins
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          mkdir -p dist
          node -e '
            const fs = require("fs");
            const path = require("path");
            const { execFileSync } = require("child_process");
            const market = "plugins-market";
            const manifestByDir = {};
            for (const dir of fs.readdirSync(market, { withFileTypes: true })) {
              if (!dir.isDirectory()) continue;
              const manifestPath = path.join(market, dir.name, "plugin.json");
              if (!fs.existsSync(manifestPath)) continue;
              const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              const asset = manifest.id.replace(/\./g, "-") + "-" + manifest.version + ".omni-plugin";
              manifestByDir[dir.name] = { manifest, asset };
              execFileSync(
                "cargo",
                ["run", "-q", "-p", "omnipanel-plugin-pkg", "--bin", "pack", "--",
                 path.join(market, dir.name), path.join("dist", asset)],
                { stdio: "inherit" },
              );
            }
            fs.writeFileSync("dist/market-assets.json", JSON.stringify(manifestByDir, null, 2));
          '
          ls -la dist

      - name: Fill market artifact hash/size into staged registry
        run: |
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const manifestByDir = JSON.parse(fs.readFileSync("dist/market-assets.json", "utf8"));
            const registry = JSON.parse(fs.readFileSync("plugins/registry.json", "utf8"));
            for (const [dir, { manifest, asset }] of Object.entries(manifestByDir)) {
              const bytes = fs.readFileSync("dist/" + asset);
              const entry = registry.plugins.find((p) => p.id === manifest.id);
              if (!entry) throw new Error("registry 缺少 " + manifest.id + "（" + dir + "）");
              const url = `https://github.com/OmniUltraX/omnipanel/releases/download/plugins-latest/${asset}`;
              const artifact = {
                url,
                sha256: crypto.createHash("sha256").update(bytes).digest("hex"),
                size: bytes.length,
              };
              if (Array.isArray(entry.versions) && entry.versions.length) {
                entry.versions[0].version = manifest.version;
                entry.versions[0].artifact = artifact;
              } else {
                entry.version = manifest.version;
                entry.distribution = "download";
                entry.artifact = artifact;
              }
              console.log(`[market-artifact] ${manifest.id} v${manifest.version} sha256/size 回填完成`);
            }
            fs.writeFileSync("plugin-registry.json", JSON.stringify(registry, null, 2) + "\n");
          '
          ls -la plugin-registry.json dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: plugins-latest
          name: Plugin registry
          body: Official OmniPanel plugin catalog (bundled first-party + downloadable extras).
          files: |
            plugin-registry.json
            dist/*.omni-plugin
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
