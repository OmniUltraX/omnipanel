# Local patch of ts_tunnel 0.5.0.
# `recv_transport_data` started a *new* handshake on every incoming packet once
# `needs_rotation` turned true, with no in-flight guard (unlike the send path at
# `Peer::send`). Each new initiation replaced the pending `Handshake::Initiated`
# state, so the response to any earlier initiation failed `try_finish`
# ("handshake failed to complete"). With continuous peer traffic the rotation
# handshake could never complete, the original session then hit
# SESSION_LIFETIME and the tunnel died ~3 minutes after every connect.
#
# THIS FILE IS AUTOMATICALLY GENERATED BY CARGO
