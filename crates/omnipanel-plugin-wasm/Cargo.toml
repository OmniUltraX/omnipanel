[package]
name = "omnipanel-plugin-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PluginLogicExecutor 的 wasmtime 实现（L2 逻辑执行）"

[dependencies]
tokio = { version = "1", features = ["rt"] }
omnipanel-plugin = { path = "../omnipanel-plugin" }
