# Local patch of ts_disco_protocol 0.5.0.
# Endpoint stored Ipv6Addr segments with a bitwise transmute into
# U16<NetworkEndian>. On little-endian machines each hextet is byte-swapped,
# so CallMeMaybe advertises the wrong address and remote hole-punch misses.
