[package]
name = "omnipanel-presence"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "操作系统在场验证与短命 presence token"

[dependencies]
omnipanel-error = { path = "../omnipanel-error" }
getrandom = "0.2"
serde.workspace = true
specta.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_WinRT",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError"] }
block2 = "0.6"
