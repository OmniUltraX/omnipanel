[package]
name = "omnipanel-transfer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "跨连接文件传输共享引擎（无 Tauri 依赖）"

[dependencies]
omnipanel-error = { path = "../omnipanel-error" }
omnipanel-ssh = { path = "../omnipanel-ssh" }
omnipanel-store = { path = "../omnipanel-store" }
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true }
tokio = { workspace = true }
async-trait.workspace = true
tracing.workspace = true

[features]
default = ["specta"]
specta = ["dep:specta"]
