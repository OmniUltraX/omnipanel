[package]
name = "omnipanel-server"
version.workspace = true
edition.workspace = true
description = "OmniPanel Web 端服务：HTTP/WS IPC 桥 + 静态托管，与 Tauri 桌面端共用同一套 Rust 业务能力"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
base64.workspace = true
futures-util.workspace = true
futures.workspace = true
async-trait.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tokio-tungstenite.workspace = true

omnipanel-core = { path = "../omnipanel-core" }
omnipanel-db = { path = "../omnipanel-db" }
omnipanel-docker = { path = "../omnipanel-docker" }
omnipanel-error = { path = "../omnipanel-error" }
omnipanel-ssh = { path = "../omnipanel-ssh" }
omnipanel-store = { path = "../omnipanel-store" }
omnipanel-ai = { path = "../omnipanel-ai" }
omnipanel-mcp = { path = "../omnipanel-mcp" }
omnipanel-s3 = { path = "../omnipanel-s3" }
bollard = { workspace = true }
reqwest = { workspace = true }
suppaftp = { version = "6", default-features = false, features = ["rustls"] }
