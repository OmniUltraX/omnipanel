[package]
name = "omnipanel-knowledge-source"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "知识源管线宿主 runner：数据源适配器契约（kind=knowledge）+ 通用同步引擎（增量/归档/重建）。插件只读供数，落库由宿主负责。"

[dependencies]
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tracing.workspace = true
tokio.workspace = true
omnipanel-error = { path = "../omnipanel-error" }
omnipanel-store = { path = "../omnipanel-store" }
omnipanel-s3 = { path = "../omnipanel-s3" }
# 思源 S3 dejavu 解密：scrypt 派生 AES-256 密钥，nonce 前置 12B 的 GCM 包，zstd 压缩层
aes-gcm = "0.10"
scrypt = "0.11"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
omnipanel-plugin = { path = "../omnipanel-plugin" }
omnipanel-plugin-js = { path = "../omnipanel-plugin-js" }
